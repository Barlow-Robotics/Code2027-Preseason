<style>
:root { color-scheme:light; --ink:#142623; --paper:#f8f7ef; --line:#b8c8be; --link:#155747; --dark:#17352f; }

body { margin:0; font:1rem/1.65 "Inter","Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
.wrap { width:min(100% - 2.5rem,67rem); margin-inline:auto; }
a { color:var(--link); text-underline-offset:.18em; }
a:hover { text-decoration-thickness:.15em; }
:focus-visible { outline:2px solid #87662d; outline-offset:4px; }
::selection { background:#d9ed97; color:var(--ink); }
header { color:#f5fae5; background:var(--dark); }
.mast { padding:1rem 0; border-bottom:1px solid #416157; }
.mast a { color:#f5fae5; font-size:.9rem; font-weight:650; }
.intro { padding:clamp(2.6rem,8vw,5.7rem) 0 clamp(2.4rem,6vw,4rem); }
h1,h2 { line-height:1.1; letter-spacing:-.035em; text-wrap:balance; }
h1 { font-family:"Instrument Sans","Segoe UI",sans-serif; font-size:clamp(2.6rem,8vw,5.4rem); margin:0 0 .33em; }
.intro p { max-width:53ch; margin:0; color:#dce9cf; font-size:1.2rem; }
main { padding-block:2rem 4rem; }
.lessons { list-style:none; margin:0; padding:0; }
.lessons li { padding:1.25rem 0 2rem; border-bottom:1px solid var(--line); }
h2 { font-size:clamp(1.65rem,4vw,2.65rem); margin:0 0 .7rem; }
.lessons p { max-width:65ch; margin:0; }
@media(max-width:36rem) { .wrap { width:calc(100% - 1.7rem); } }

    <p>Choose a lesson to open the step-by-step instructions.</p>
  </div>
</header>
<main class="wrap">
